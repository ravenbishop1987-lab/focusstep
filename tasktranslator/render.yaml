services:
  - type: web
    name: focusstep-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start

  - type: web
    name: focusstep-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
