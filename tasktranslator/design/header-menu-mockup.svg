  <text x="272" y="548" font-family="Arial, sans-serif" font-size="28" fill="#7A7168">“I need to call my landlord, email my boss, and</text>
  <text x="272" y="588" font-family="Arial, sans-serif" font-size="28" fill="#7A7168">figure out groceries but I’m overwhelmed.”</text>

