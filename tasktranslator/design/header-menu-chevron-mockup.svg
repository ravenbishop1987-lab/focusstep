  <text x="256" y="440" font-family="Arial, sans-serif" font-size="24" fill="#2C2825">One visible account control instead of two competing buttons.</text>
  <text x="256" y="474" font-family="Arial, sans-serif" font-size="24" fill="#2C2825">Dashboard remains obvious because the trigger still looks like Dashboard.</text>

